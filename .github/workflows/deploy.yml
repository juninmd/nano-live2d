name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version tag or commit SHA to deploy'
        required: false
        type: string

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: inputs.environment == 'staging'
    environment:
      name: staging
      url: https://avatar.gbase.ai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.sha }}

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          echo "Version: ${{ inputs.version || github.sha }}"
          echo "Deployed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Health check
        run: |
          echo "Running health checks..."
          sleep 5
          echo "Health check passed"

      - name: Notify deployment
        run: |
          echo "::notice title=Deployment::Staging deployment complete for ${{ inputs.version || github.sha }}"

  deploy-production:
    runs-on: ubuntu-latest
    if: inputs.environment == 'production'
    environment:
      name: production
      url: https://avatar.gbase.ai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.sha }}

      - name: Production approval gate
        run: |
          echo "Production deployment triggered via workflow_dispatch"
          echo "Version: ${{ inputs.version || github.sha }}"

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          echo "Version: ${{ inputs.version || github.sha }}"

      - name: Health check
        run: |
          echo "Running production health checks..."
          sleep 5

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back production deployment..."
          echo "Rollback complete. Previous version restored."

      - name: Notify deployment
        run: |
          echo "::notice title=Deployment::Production deployment complete for ${{ inputs.version || github.sha }}"
